<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LNKmaphys</title>
    <link rel="shortcut icon" href="images/lnkamaphys-logo.ico" type="image/x-icon">
    <link rel="stylesheet" href="lnkmaphys.css">
    <link rel="stylesheet" href="lnkmaphys-platform.css">

    <style>
       .rev {
         display: inline-block;
         position: relative;
         width: calc(100% - 38px);
       }

       .searcher {
        width: 100%;
       }
       .main {
        background-color: white;
        opacity: 0;
    position: absolute;
    top: 100%;
    width: 100%;
    border-bottom-left-radius: 5px;
    border-bottom-right-radius: 5px;
    overflow: hidden;
       }

       
       .main > .psearcher{
        transition-property: width, background-color;
        transition-duration: 0.2s;
           z-index: 20;
           width: 100%;
           position: absolute;
           text-align: center;
           padding-top: 1.5px;
           padding-bottom: 1.5px;
          margin: 0 0 0 0 ;
           text-align: center;
           background-color: white;
           font-family: var(--calsans);
           font-size: clamp(0.75rem, 1.5vw, 0.85rem);
       }
        

       .psearcher:hover {
         cursor: pointer;
       }

        input:focus ~ .main {
           opacity: 100;
           display: none;
       }

       span.phelp {
        font-size: clamp(0.75rem, 1.5vw, 0.85rem);
       }

       #i-cards {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 20px;
        max-width: 1000px;
        padding: 0px 10px;
        margin: 20px auto;
       }

       .icard {
        background-color: var(--side2blue);
        border: 5px solid var(--side1blue);
        /*aspect-ratio: 1.2;*/
        border-radius: 15px;
        padding: 0px 5px;
        cursor: pointer;
        display: flex;
        flex-direction: column;
       }

       .try {
        margin: 10px 0px;
        border-radius: 15;
        flex-grow: 1;
        display: flex;
        align-items: center;
        justify-content: center;

        p {
            border-radius: 5px;
            background-color: rgb(255, 218, 242);
            padding: 4px;
            max-height: 70px;
            overflow: hidden;
       }
    }

       .holder {
        padding-top: 10px;
        width: 100%;
        aspect-ratio: 1.4;
       img {
            height: 100%;
            display: block;
            margin: auto;
        }
       }

       @media (max-width: 820px) {
        #i-cards {
            background-color: aquamarine;
            grid-template-columns: 1fr 1fr;
            max-width: 640px;
        }
       }

       @media (max-width: 550px) {
        #i-cards {
            background-color: aquamarine;
            grid-template-columns: 1fr;
            max-width: 300px;
        }
       }
    </style>
</head>
