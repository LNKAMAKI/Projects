<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partitioner</title>
    <link rel="stylesheet" href="partitioner.css">
</head>
<body onload="load()">
    <script src="partitioner.js"></script>
    <header>
        <h1>Fracionador</h1>
    </header>
   <main>

   </main>
   <div class='controls'>
      <button class='colorize-desktop' onclick="colorize_desktop()">colorir</button>
      <button class='divide' onclick="divide()">fracionar</button>
      <button class='deletar' onclick="deletar()">deletar</button>
   </div>

   <div class="controls divide-tab">
         <div class="input-container fractions">
        <span>cols:</span>
        <input type="number" id='columnsdiv' value='2'>
        ,
        <span>rows:</span>
        <input type="number" id='rowsdiv' value='2'>
    </div> 
   </div>


   <div class='controls'>
       <div class="input-container">
        <span>width:</span>
        <input type="number" id='width' value='1'>
        /
        <span>height:</span>
        <input type="number" id='height' value='1'>
    </div>
    <div class="input-container fractions">
        <span>cols:</span>
        <input type="number" id='columns' value='2'>
        ,
        <span>rows:</span>
        <input type="number" id='rows' value='2'>
    </div> 
    <div class="input-container color">
        <input type="color" id='color' value='#d0f3fb'>
    </div> 
    <button id='partitioner' onclick="initializePartitioner()">Criar</button>
</div>
</body>
</html>
